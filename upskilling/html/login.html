<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PLogin Page</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
			margin: 0;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;


		}
        .login-container {
            width: 360px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.8s ease;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #971d1d;
        }

        .login-container p {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button:hover {
            background: #8a1515;
        }

        input:focus {
            outline: none;
            border-color: #971d1d;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            background: #971d1d;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        

        .extra-links {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        .extra-links a {
            color: #971d1d;
            font-weight: 600;
            text-decoration: none;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Local Community Event Portal</h2>
    <p>Logged in User only</p>
       <form onsubmit="window.location.href='index.html'; return false;">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password">

    <button type="submit">Login</button>
</form>
    <div class="extra-links">
        <p>New user? <a href= "#">Create an account</a></p>
        <p><a href="#">Forgot password?</a></p>
    </div>

</div>


</body>
</html>
